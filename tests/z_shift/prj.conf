CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ASSERT=y
# Match the firmware's millisecond timing; native_sim's coarse default tick
# can round a requested 190ms sleep up to the 200ms double-tap boundary.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_ZMK_USJIS=y
CONFIG_ZMK_USJIS_DEFAULT_ENABLED=y
CONFIG_ZMK_USJIS_LAYER_MASK=0
