name: Test responsive Z Shift
on:
  push:
    branches: [codex/responsive-z-shift]
  workflow_dispatch:

jobs:
  z-shift:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v6
      - name: Test independent timing state machine
        run: |
          mkdir -p work
          cc -std=c11 -Wall -Wextra -Werror -Isrc tests/z_shift/state_test.c -o work/z-shift-state
          work/z-shift-state
      - uses: actions/checkout@v6
        with:
          repository: cormoran/zmk
          ref: 1fc72aaff7a42bd533c1f4c9b3f23c5317c745f4
          path: work/native/zmk
      - uses: actions/checkout@v6
        with:
          repository: mentaldesk/oskey
          ref: 78658510090f60a63cbaf551145c66ad722d2980
          path: work/native/oskey
      - name: Fetch matching Zephyr
        working-directory: work/native/zmk
        run: |
          west init -l app
          west update --narrow -o=--depth=1 zephyr
          west zephyr-export
      - name: Build actual behavior with ZMK HID and event manager
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host
        run: |
          cmake -GNinja -S tests/z_shift -B work/z-shift-test \
            -DBOARD=native_sim/native/64 \
            -DZMK_SOURCE_DIR="$GITHUB_WORKSPACE/work/native/zmk" \
            -DOSKEY_SOURCE_DIR="$GITHUB_WORKSPACE/work/native/oskey" \
            -DZEPHYR_MODULES="$GITHUB_WORKSPACE"
          cmake --build work/z-shift-test
      - name: Verify Shift ordering and Z outputs
        shell: bash
        run: |
          set -o pipefail
          timeout 30s work/z-shift-test/zephyr/zephyr.exe | tee work/z-shift-reports.log
          grep -q '^Z_SHIFT_HID_PASS' work/z-shift-reports.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: z-shift-test-evidence
          path: |
            work/z-shift-reports.log
            work/z-shift-test/zephyr/.config
            work/z-shift-test/zephyr/linker_zephyr_pre0.cmd
            work/z-shift-test/zephyr/zephyr.dts
